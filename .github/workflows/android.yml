name: APK Android e Flatpak

# Costruisce l'APK (universale: arm64-v8a e armeabi-v7a) e il Flatpak (x86_64).
# - push su main: release «beta» (pre-release, sostituita a ogni build, stessa firma delle release);
# - tag vX.Y.Z (uguale alla versione in Cargo.toml): release stabile.
# La versione e il versionCode vengono da Cargo.toml (vedi docs/RILASCI.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crates/**"
      - "android/**"
      - "flatpak/**"
      - "tools/build_apk.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust stable + target Android
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - name: Test e validazione dell'esempio
        run: |
          cargo test -p prep-core
          cargo run -q -p prep-core --bin prep -- validate examples/esempio

      - name: Versione
        id: ver
        run: |
          V="$(python3 tools/version_code.py --name)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$V" ] || { echo "::error::il tag $GITHUB_REF_NAME non corrisponde alla versione $V di Cargo.toml"; exit 1; }
            CL="fastlane/metadata/android/it-IT/changelogs/$(python3 tools/version_code.py).txt"
            [ -f "$CL" ] || { echo "::error::manca $CL (note di versione)"; exit 1; }
            echo "tag=v$V" >> "$GITHUB_OUTPUT"
          else
            echo "tag=beta" >> "$GITHUB_OUTPUT"
            # solo le beta portano numero di build e commit nella versione
            echo "APP_BUILD=${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Installa cargo-apk
        run: cargo install cargo-apk --version 0.10.0 --locked

      - name: Build APK (arm64-v8a + armeabi-v7a)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # APK distribuiti qui: l'app si aggiorna da sola dalle release (beta o stabili)
          TP_UPDATES: github
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE="$RUNNER_TEMP/release.jks"
          else
            # release e beta si firmano solo con la chiave del progetto (docs/RILASCI.md › Firma):
            # così ogni versione aggiorna quella installata
            echo "::error::secret ANDROID_KEYSTORE_B64/ANDROID_KEYSTORE_PASSWORD mancanti: niente APK senza la chiave"
            exit 1
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          export KEYSTORE_PASSWORD
          SPLIT=1 tools/build_apk.sh TremendousPreparator.apk
          # impronta del certificato: per verificare che un APK sia autentico
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          FP="$("$BT/apksigner" verify --print-certs TremendousPreparator.apk | sed -n 's/.*SHA-256 digest: //p' | head -1)"
          echo "Certificato SHA-256: $FP"
          echo "CERT_SHA256=$FP" >> "$GITHUB_ENV"

      # copia di comodo: il file vero è nella release; se il servizio artifact di GitHub
      # non risponde non deve bloccare la pubblicazione
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        timeout-minutes: 4
        with:
          name: TremendousPreparator-apk
          path: TremendousPreparator*.apk

      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ "$TAG" = beta ]; then
            gh release delete beta --cleanup-tag --yes 2>/dev/null || true
            gh release create beta TremendousPreparator*.apk --target "$GITHUB_SHA" --prerelease \
              --title "Beta $VERSION+$APP_BUILD" \
              --notes "Build automatica dell'ultimo commit (${GITHUB_SHA::7}), non ancora rilasciata: firmata con la stessa chiave delle release, si installa sopra la versione precedente. APK Android: TremendousPreparator.apk è universale (se non sai quale scegliere, prendi questo); -arm64-v8a e -armeabi-v7a sono più leggeri, per telefoni a 64 o 32 bit. Flatpak x86_64. Certificato SHA-256: ${CERT_SHA256}"
          else
            NOTES="$RUNNER_TEMP/note.md"
            cp "fastlane/metadata/android/it-IT/changelogs/$(python3 tools/version_code.py).txt" "$NOTES"
            printf '\n\nAPK: TremendousPreparator.apk è universale (se non sai quale scegliere, prendi questo); -arm64-v8a e -armeabi-v7a sono più leggeri.\nCertificato SHA-256: %s\n' "$CERT_SHA256" >> "$NOTES"
            gh release create "$TAG" TremendousPreparator*.apk --verify-tag --latest \
              --title "Tremendous Preparator $VERSION" --notes-file "$NOTES"
          fi

  flatpak:
    # pacchetto desktop x86_64 (Framework Laptop 12 / Linux), allegato alla stessa release
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop

      - name: Dipendenze di sistema
        run: |
          # risoluzione DNS robusta (bypass systemd-resolved) e bypass mirror Azure su runner noble
          echo -e "nameserver 8.8.8.8\nnameserver 1.1.1.1" | sudo tee /etc/resolv.conf
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          for i in 1 2 3; do sudo apt-get update -qq && break || sleep 5; done
          sudo apt-get install -y -qq libfontconfig1-dev libxkbcommon-dev libwayland-dev flatpak flatpak-builder
          # bubblewrap (flatpak-builder) ha bisogno degli user namespace non privilegiati
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Compila il binario desktop
        run: |
          if [ "${{ needs.apk.outputs.tag }}" = beta ]; then export APP_BUILD="${{ github.run_number }}-${GITHUB_SHA::7}"; fi
          cargo build --release -p tremendouspreparator --bin prepapp-desktop
          cp target/release/prepapp-desktop flatpak/tremendous-preparator
          ldd flatpak/tremendous-preparator

      - name: Runtime Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Costruisci il bundle
        run: |
          cd flatpak
          flatpak-builder --user --force-clean --repo=repo build io.github.nernerone.TremendousPreparator.yml
          flatpak build-bundle repo ../TremendousPreparator-x86_64.flatpak io.github.nernerone.TremendousPreparator \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ls -la ../TremendousPreparator-x86_64.flatpak

      # copia di comodo: il file vero è nella release; se il servizio artifact di GitHub
      # non risponde non deve bloccare la pubblicazione
      - uses: actions/upload-artifact@v7
        continue-on-error: true
        timeout-minutes: 4
        with:
          name: TremendousPreparator-flatpak
          path: TremendousPreparator-x86_64.flatpak

      - name: Allega alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.apk.outputs.tag }}" TremendousPreparator-x86_64.flatpak --clobber
