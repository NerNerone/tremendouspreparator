name: Controlli

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # niente avviso di git sul nome del ramo predefinito durante il checkout
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Audit dipendenze Rust
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}

      - name: Audit dipendenze Node
        run: npm --prefix tools audit --audit-level=moderate

      - name: Dipendenze di sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1-dev libxkbcommon-dev libwayland-dev

      - name: Formattazione
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test -p prep-core

      - name: Contenuti di esempio
        run: cargo run -q -p prep-core --bin prep -- validate examples/esempio

      - name: Versione e versionCode coerenti
        run: python3 tools/version_code.py --check

      - name: Regole della concentrazione (Java, senza Android)
        run: |
          javac --release 17 -d "$RUNNER_TEMP/focus" android/java/io/github/nernerone/tremendouspreparator/FocusPolicy.java android/test/FocusPolicyTest.java
          java -cp "$RUNNER_TEMP/focus" io.github.nernerone.tremendouspreparator.FocusPolicyTest
