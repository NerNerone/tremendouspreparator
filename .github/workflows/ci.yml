name: Controlli

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Dipendenze di sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1-dev libxkbcommon-dev libwayland-dev

      - name: Formattazione
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test -p prep-core

      - name: Contenuti di esempio
        run: cargo run -q -p prep-core --bin prep -- validate
