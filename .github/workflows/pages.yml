name: Web app (GitHub Pages)

# Costruisce la versione web (WebAssembly) e la pubblica su GitHub Pages.
# Su iPhone: aprila in Safari e scegli Condividi → Aggiungi alla schermata Home.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # niente avviso di git sul nome del ramo predefinito durante il checkout
      - run: git config --global init.defaultBranch main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust stable + target WebAssembly
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: web

      - name: wasm-bindgen (stessa versione del Cargo.lock)
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$V" --locked

      - name: Compila
        run: |
          export APP_BUILD="web-${GITHUB_SHA::7}"
          # strip=true toglierebbe anche la sezione target_features che serve a wasm-bindgen
          export CARGO_PROFILE_RELEASE_STRIP=debuginfo
          cargo build --release -p tremendouspreparator --lib --target wasm32-unknown-unknown

      - name: Prepara il sito
        run: |
          mkdir -p site
          # i nomi delle funzioni servono solo al debug: senza, il wasm resta leggero
          wasm-bindgen --target web --no-typescript --remove-name-section --remove-producers-section --out-dir site \
            target/wasm32-unknown-unknown/release/prepapp.wasm
          cp web/* site/
          # nuova versione → nuova cache del service worker
          sed -i "s/tremendouspreparator-v1/tremendouspreparator-${GITHUB_SHA::7}/" site/sw.js
          ls -la site

      # come actions/upload-pages-artifact, ma con upload-artifact recente (Node 24)
      - name: Archivio per Pages
        run: tar --dereference --hard-dereference --directory site -cvf "$RUNNER_TEMP/artifact.tar" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
