name: Web app (GitHub Pages)

# Costruisce la versione web (WebAssembly) e la pubblica su GitHub Pages.
# Su iPhone: aprila in Safari e scegli Condividi → Aggiungi alla schermata Home.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Rust stable + target WebAssembly
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: web

      - name: wasm-bindgen (stessa versione del Cargo.lock)
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$V" --locked

      - name: Compila
        run: |
          export APP_BUILD="web-${GITHUB_SHA::7}"
          cargo build --release -p tremendouspreparator --lib --target wasm32-unknown-unknown

      - name: Prepara il sito
        run: |
          mkdir -p site
          wasm-bindgen --target web --no-typescript --out-dir site \
            target/wasm32-unknown-unknown/release/prepapp.wasm
          cp web/* site/
          # nuova versione → nuova cache del service worker
          sed -i "s/tremendouspreparator-v1/tremendouspreparator-${GITHUB_SHA::7}/" site/sw.js
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
