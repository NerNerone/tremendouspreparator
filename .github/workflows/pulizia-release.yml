# Elimina le release vX.Y.Z (e i loro tag) con versione minore di quella indicata.
# Solo a mano (Actions › Pulizia release › Run workflow); non tocca anteprima e contenuti.
name: Pulizia release

on:
  workflow_dispatch:
    inputs:
      below:
        description: "Elimina le versioni minori di (es. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  pulizia:
    runs-on: ubuntu-latest
    steps:
      - name: Elimina release e tag vecchi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BELOW: ${{ inputs.below }}
        run: |
          set -euo pipefail
          [[ "$BELOW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "versione non valida: $BELOW"; exit 1; }
          older() { [ "$1" != "$BELOW" ] && [ "$(printf '%s\n%s\n' "$1" "$BELOW" | sort -V | head -1)" = "$1" ]; }
          { gh release list -R "$REPO" -L 1000 --json tagName -q '.[].tagName'; gh api "repos/$REPO/tags" --paginate -q '.[].name'; } \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV | while read -r t; do
            older "${t#v}" || continue
            if gh release view "$t" -R "$REPO" >/dev/null 2>&1; then
              echo "release $t"; gh release delete "$t" -R "$REPO" --cleanup-tag -y
            elif gh api "repos/$REPO/git/refs/tags/$t" >/dev/null 2>&1; then
              echo "tag $t"; gh api -X DELETE "repos/$REPO/git/refs/tags/$t"
            fi
          done
