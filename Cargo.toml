[workspace]
resolver = "2"
members = ["crates/prep-core", "crates/prep-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/NerNerone/tremendouspreparator"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
