[workspace]
resolver = "2"
members = ["crates/prep-core", "crates/prep-app"]

[workspace.package]
version = "0.2.0" # versionCode 16777728
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/NerNerone/tremendouspreparator"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# l'OCR in debug sarebbe lentissimo: le sue dipendenze si compilano sempre ottimizzate
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.ocrs]
opt-level = 3
