[package]
name = "tremendouspreparator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Tremendous Preparator — app di studio (Rust + Slint, Material 3) per Android, Linux e browser"

[lib]
name = "prepapp"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "prepapp-desktop"
path = "src/main.rs"

[dependencies]
prep-core = { path = "../prep-core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
web-time = "1"

# collegamenti ai relay per la sincronizzazione tra dispositivi (nel browser: WebSocket di JS)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# collegamento diretto tra dispositivi (WebRTC, crittografia in puro Rust)
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-femtovg"] }
jni = "0.21"

[build-dependencies]
slint-build = "=1.18.1"

# --- configurazione APK (cargo-apk) ---
[package.metadata.android]
package = "it.tremendouspreparator.app"
apk_name = "SemestreAperto"
build_targets = ["aarch64-linux-android"]
strip = "strip"
resources = "../../android/res"

[package.metadata.android.sdk]
min_sdk_version = 34
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# promemoria giornaliero (codice Java in android/java, aggiunto dalla CI)
[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECEIVE_BOOT_COMPLETED"

[package.metadata.android.application]
label = "Tremendous Preparator"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
has_code = true

[package.metadata.android.application.activity]
name = "it.tremendouspreparator.app.MainActivity"
orientation = "portrait"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|uiMode|density"

[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
slint = { version = "=1.18.1" }
png = "0.17"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# versione web (GitHub Pages): disegno WebGL, dati in IndexedDB, file scelti dal browser
[target.'cfg(target_arch = "wasm32")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "wasmbind"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
