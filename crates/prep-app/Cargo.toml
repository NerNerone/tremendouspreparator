[package]
name = "tremendouspreparator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Tremendous Preparator — app di studio (Rust + Slint, Material 3) per Android, Linux e browser"

[lib]
name = "prepapp"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "prepapp-desktop"
path = "src/main.rs"

[dependencies]
prep-core = { path = "../prep-core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
web-time = "1"
# foto profilo e del gruppo (già nell'albero delle dipendenze tramite Slint)
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# collegamenti ai relay per la sincronizzazione tra dispositivi (nel browser: WebSocket di JS)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# collegamento diretto tra dispositivi (WebRTC, crittografia in puro Rust)
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
# OCR sul dispositivo (modelli ONNX scaricati la prima volta che si usa)
ocrs = "0.14"
rten = { version = "0.28", default-features = false, features = ["onnx_format"] }
rten-imageproc = "0.28"
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-android-activity-06", "renderer-femtovg"] }
jni = "0.21"

[build-dependencies]
slint-build = "=1.18.1"

# --- configurazione APK (cargo-apk) ---
[package.metadata.android]
package = "io.github.nernerone.tremendouspreparator"
apk_name = "TremendousPreparator"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]
strip = "strip"
resources = "../../android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# promemoria giornaliero (codice Java in android/java, aggiunto dalla CI)
[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

# Android 16: la notifica della sessione di studio può diventare un aggiornamento in tempo reale
[[package.metadata.android.uses_permission]]
name = "android.permission.POST_PROMOTED_NOTIFICATIONS"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECEIVE_BOOT_COMPLETED"

[package.metadata.android.application]
label = "Tremendous Preparator"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"
has_code = true

[package.metadata.android.application.activity]
name = "io.github.nernerone.tremendouspreparator.MainActivity"
orientation = "portrait"
config_changes = "orientation|screenSize|screenLayout|keyboardHidden|uiMode|density"

[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
slint = { version = "=1.18.1", features = ["raw-window-handle-06"] }
png = "0.17"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# appunti su Wayland con il protocollo standard (vedi src/wl_clipboard.rs): il backend di Slint
# resta lo stesso, si sostituiscono solo copia e incolla
[target.'cfg(target_os = "linux")'.dependencies]
i-slint-core = { version = "=1.18.1", default-features = false }
i-slint-backend-winit = { version = "=1.18.1", default-features = false }
smithay-clipboard = "0.7"
raw-window-handle = "0.6"

# versione web (browser): disegno WebGL, dati in IndexedDB, file scelti dal browser
[target.'cfg(target_arch = "wasm32")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "wasmbind"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
