[package]
name = "prep-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Logica dell'app: contenuti, quiz, flashcard, modello dei progressi, sincronizzazione tra dispositivi"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
fastrand = "2"
regex-lite = "0.1"
base64 = "0.22"
sha1_smol = "1"
unicode-normalization = "0.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# sincronizzazione tra dispositivi: chiave dalla password, cifratura e firme degli eventi Nostr
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
k256 = { version = "0.14", default-features = false, features = ["schnorr", "arithmetic", "std"] }
getrandom = "0.2"
# strumenti PDF: dividere in parti e estrarre il testo
lopdf = { version = "0.47", default-features = false }
# «Estrai il testo» anche da Word, PowerPoint, OpenDocument ed EPUB (XML dentro archivi ZIP)
roxmltree = "0.21"

# nel browser il caso e l'ora vengono da JavaScript
[target.'cfg(target_arch = "wasm32")'.dependencies]
fastrand = { version = "2", default-features = false, features = ["std", "js"] }
getrandom = { version = "0.2", features = ["js"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde", "wasmbind"] }
lopdf = { version = "0.47", default-features = false, features = ["wasm_js"] }
