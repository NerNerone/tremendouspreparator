# Flatpak x86_64 (desktop Linux, es. Framework Laptop 12 con Aurora/KDE).
# Il binario viene compilato dalla CI (cargo build --release) e copiato qui come
# flatpak/tremendous-preparator prima di flatpak-builder.
app-id: io.github.nernerone.TremendousPreparator
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: tremendous-preparator
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # promemoria giornaliero: notifiche e avvio automatico all'accesso
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-config/autostart:create
  # aggiornamenti dalle release: installa il nuovo bundle con flatpak sull'host
  - --talk-name=org.freedesktop.Flatpak
  # importazione del pacchetto contenuti (.json.gz) da Download
  - --filesystem=xdg-download:ro
modules:
  - name: tremendous-preparator
    buildsystem: simple
    build-commands:
      - install -Dm755 tremendous-preparator /app/bin/tremendous-preparator
      - install -Dm644 io.github.nernerone.TremendousPreparator.desktop /app/share/applications/io.github.nernerone.TremendousPreparator.desktop
      - install -Dm644 io.github.nernerone.TremendousPreparator.metainfo.xml /app/share/metainfo/io.github.nernerone.TremendousPreparator.metainfo.xml
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.nernerone.TremendousPreparator.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.nernerone.TremendousPreparator.png
      - install -Dm644 io.github.nernerone.TremendousPreparator.svg /app/share/icons/hicolor/scalable/apps/io.github.nernerone.TremendousPreparator.svg
    sources:
      - type: file
        path: tremendous-preparator
      - type: file
        path: io.github.nernerone.TremendousPreparator.desktop
      - type: file
        path: io.github.nernerone.TremendousPreparator.metainfo.xml
      - type: file
        path: icon-256.png
      - type: file
        path: icon-128.png
      - type: file
        path: io.github.nernerone.TremendousPreparator.svg
